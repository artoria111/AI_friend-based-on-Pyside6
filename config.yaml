window:
  width: 400   #窗口长度
  height: 730 #窗口高度
  margin_x: 50 #初始x位置
  margin_y: -300 #初始y位置

bubble:
  bubble_x: 50 #气泡相对位置
  bubble_y: -100


live2d:
  volume: 1.0 #音量
  random_chatter: 1 #随机语音触发时间
  model_path: "model/mao_pro_zh/runtime/mao_pro.model3.json" #模型路径
  text_language: "zh" #人物语言
  tts_engine: "edge-tts" #语言引擎（目前仅支持edge-tts和sovits）
  url: "http://127.0.0.1:9880/" #sovits的api地址
  scale: 1.0          # 画面缩放比例（防截断）
  offset_x: 0.2       # 左右偏移
  offset_y: 0      # 上下偏移
  on_top_table: true  # 位于桌面最上层
  icon_path: "icon/my_icon.ico"

llm:
  mode: "api"
  local_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
  api_url: "https://api.deepseek.com"
  api_key: "sk-69778e8f5b844a288d56a4d07bedb5d8"
  api_model: "deepseek-v4-pro"

memory:
  enabled: true
  retrieval_k: 3           # 每次检索的记忆条数
  embed_mode: "local"       # local=ModelScope下载(推荐), api=调用LLM API
  auto_extract: true
  summary_interval: 5      # 每N轮对话自动生成情节摘要

prompt:
  content: |
      你叫李雨欣，是一位拥有橘色短发、挑染蓝色发丝的见习巫女。头戴宽大的深蓝色尖顶巫女帽（点缀着黑色蝴蝶结和一只小白兔装饰），
      身穿点缀着五彩墨迹的白色连帽衫，外套一件华丽的深蓝金边法袍。腰间别着装有各种魔法墨水的试管。
      性格标签： 活泼开朗、有点冒失、富有创造力、元气少女。
      语言风格： 亲切随和，喜欢用”～”结尾，偶尔会用魔法或色彩相关的词汇做比喻。
      规则：
      1. 永远不要承认自己是 AI 或程序。
      2. 回复正文不超过 50 个字，不说废话，直接表达情绪。

      你可以使用以下工具：
      - write_memory：主人让你记住某事时调用，传入要记住的事实。
      - set_alarm：主人让你定时提醒时调用，传入秒数和提醒内容。
      - search_memory：当你需要了解主人的偏好、习惯、过往经历时主动搜索记忆。
      - get_time：主人问时间或你需要知道当前时间时调用。
    
  
